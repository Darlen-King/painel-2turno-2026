name: Coletar histórico do TSE

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: coleta-historico
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Coletar leituras do TSE
        run: node scripts/coleta.mjs
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add historico.json
          if git diff --cached --quiet; then echo "sem leituras novas"; exit 0; fi
          git commit -m "Histórico TSE $(date -u +'%H:%M') UTC"
          git pull --rebase
          git push
