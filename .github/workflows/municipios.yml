name: Gerar dados por cidade

on:
  workflow_dispatch:   # rodar manualmente em Ações → "Gerar dados por cidade" → Run workflow

permissions:
  contents: write

concurrency:
  group: dados-cidades
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Baixar resultados por cidade (TSE) e mapas (IBGE)
        run: node scripts/municipios.mjs
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "Dados por cidade (1º e 2º turno)"
          git pull --rebase
          git push
